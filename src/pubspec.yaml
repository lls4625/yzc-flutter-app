name: nihongo_path
description: 语之初 V3，iOS SQLite 离线学习。
publish_to: none
version: 3.1.0
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  liquid_glass_widgets:
    hosted: https://pub.dev
    version: 1.4.0
  cupertino_icons: ^1.0.8
  tutorial_coach_mark:
    hosted: https://pub.dev
    version: 1.3.4
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  archive: 3.6.1
  crypto: ^3.0.6
  cryptography: 2.9.0
flutter:
  uses-material-design: true
  assets:
    - assets/legal/privacy_policy.txt
